name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.json sw.js CNAME src models fonts icons _site/

      # Stamp every local asset URL and the service worker's cache with this
      # commit, so a browser can't pair a cached file from one deploy with
      # the page from another.
      - name: Stamp version
        run: node tool/stamp.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
