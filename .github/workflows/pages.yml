name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp every local asset URL with this commit, so a browser can't pair
      # a cached script from one deploy with the page from another.
      - name: Stamp version
        run: |
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/g" index.html
          ! grep -q "__VERSION__" index.html

      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html style.css CNAME src models fonts _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
